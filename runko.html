<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUPA PÄIVÄRUNKO</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #090a0e;
    --surface2: #0c0f14;
    --border: #2a3040;
    --border-bright: #3a4558;
    --accent-rides: #f58439;
    --accent-mg: #5557cf;
    --text: #e2e2ee;
    --text-dim: #a8add3;
    --text-dimmer: #9090a3;
    --red: #f87171;
    --green: #4ade80;
    --yellow: #fbbf24;
    --radius: 6px;
    --mono: 'Chivo Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    min-height: 100vh;
    overflow-x: auto;
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: fixed;
    top: 0;
    left: 0;
    z-index: 100;
    width: 100%;
  }

  .header-title {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text);
  }

  .date-picker-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .date-nav-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 28px; height: 28px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .date-nav-btn:hover { border-color: var(--border-bright); color: var(--text); }

  

  #date-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 5px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    outline: none;
  }
  #date-input:focus { border-color: var(--border-bright); }

  .today-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
  }
  .today-btn:hover { border-color: var(--border-bright); color: var(--text); }

  /* ── KOPIOI POHJA ── */
  .copy-wrap { display: flex; align-items: center; gap: 8px; margin-right: 8px; }
  .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--border-bright); color: var(--text); }
  .copy-btn.confirm { background: var(--accent-rides); border-color: var(--accent-rides); color: #0a0e15; font-weight: 600; }
  .copy-btn.confirm:disabled { opacity: 0.35; cursor: not-allowed; }
  .copy-target {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent-rides);
    white-space: nowrap;
  }
  .copy-wrap [data-copy-mode] { display: none; }
  .copy-wrap.active [data-copy-mode="on"] { display: inline-flex; }
  .copy-wrap:not(.active) [data-copy-mode="off"] { display: inline-flex; }
  body.copy-mode .panel-rides { outline: 2px dashed var(--accent-rides); outline-offset: -6px; }

  /* Locked: header controls are dead (also made inert in JS) */
  body.locked .date-picker-wrap { pointer-events: none; opacity: 0.35; }

  .sync-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dimmer);
  }
  .sync-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dimmer);
    transition: background 0.3s;
  }
  .sync-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .sync-dot.saving { background: var(--yellow); }

  /* LOCKSCREEN */
  .lock-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 68px; height: 28px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .lock-btn:hover { border-color: var(--border-bright); color: var(--text); }

  #lock-btn.active{
    background: var(--border);
  }

  .lockscreen{
    background-color: rgba(109, 108, 108, 0.137);
    position: fixed;
    inset: 0; 
    z-index: 10;
  }

  #lockscreen {
    display: none;
  }
  #lockscreen.active {
    display: block;
  }


  /* ── MAIN LAYOUT ── */
  .panels {
    display: flex;
    gap: 0;
    min-height: calc(100vh - 53px);
    flex-direction: row;
  }
  @media only screen and (max-width: 1000px){
    .panels{
      flex-direction: column;
    }
  }

  .panel {
    flex: 1;
    min-width: 600px;
    padding: 20px;
    border-right: 2px solid var(--border);
  }
  .panel:last-child { border-right: none; }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .panel-rides .panel-title { color: var(--accent-rides); }
  .panel-mg .panel-title { color: var(--accent-mg); }

  .panel-accent-bar {
    height: 2px;
    flex: 1;
    border-radius: 1px;
  }
  .panel-rides .panel-accent-bar { background: linear-gradient(to right, var(--accent-rides), transparent); }
  .panel-mg .panel-accent-bar { background: linear-gradient(to right, var(--accent-mg), transparent); }

  /* ── TABLE ── */
  .schedule-table {
    width: 100%;
    border-collapse: collapse;
  }

  .schedule-table thead th {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    padding: 0 8px 10px 8px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .col-time { width: 80px; }
  .col-length { width: 80px; }
  .col-pax { width: 130px; }
  .col-more { width: auto; }

  /* ── TIMESLOT ROWS ── */
  .timeslot-group {}

  .timeslot-header-row td {
    padding-top: 10px;
  }

  .time-cell {
    vertical-align: top;
    padding: 0 8px;
  }

  .time-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 5px 9px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    margin-top: 4px;
  }
  .time-badge:hover {
    border-color: var(--border-bright);
    background: #252b3a;
  }
  .time-badge .edit-icon { font-size: 10px; opacity: 0.4; }

  .length-cell {
    vertical-align: top;
    padding: 4px 8px 0 8px;
  }

  .length-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    margin-top: 4px;
  }
  .length-badge:hover { border-color: var(--border-bright); color: var(--text); }
  .length-badge.has-value { color: var(--text); }

  /* ── TIMESLOT LENGTH COLOUR TINTING ── */
  .ts-color-500m td { background: rgba(251, 146, 60, 0.08); }
  .ts-color-500m td:first-child { border-left: 3px solid rgba(251, 146, 60, 0.6); }
  .ts-color-1km td { background: rgba(74, 222, 128, 0.07); }
  .ts-color-1km td:first-child { border-left: 3px solid rgba(74, 222, 128, 0.5); }
  .ts-color-2km td { background: rgba(96, 165, 250, 0.08); }
  .ts-color-2km td:first-child { border-left: 3px solid rgba(96, 165, 250, 0.55); }
  .ts-color-5km td { background: rgba(248, 113, 113, 0.08); }
  .ts-color-5km td:first-child { border-left: 3px solid rgba(248, 113, 113, 0.55); }

  /* Length picker popup */
  .length-options {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .length-option {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    padding: 12px 8px;
    border-radius: var(--radius);
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .length-option:hover { border-color: var(--border-bright); color: var(--text); }
  .length-option.selected { color: #0a0e15; font-weight: 700; }
  .length-option[data-val="-"] { grid-column: span 3; font-size: 12px; color: var(--text-dimmer); }
  .length-option[data-val="-"].selected { background: var(--border); color: var(--text); border-color: var(--border-bright); }
  .length-option[data-val="500m"].selected { background: rgb(251,146,60); border-color: rgb(251,146,60); }
  .length-option[data-val="1km"].selected  { background: rgb(74,222,128);  border-color: rgb(74,222,128); }
  .length-option[data-val="2km"].selected  { background: rgb(96,165,250);  border-color: rgb(96,165,250); }
  .length-option[data-val="5km"].selected  { background: rgb(248,113,113); border-color: rgb(248,113,113); }

  /* ── SUB-ROWS ── */
  .subrow td {
    padding: 3px 8px;
    vertical-align: middle;
  }

  .subrow:first-of-type td { padding-top: 6px; }
  .subrow:last-of-type td { padding-bottom: 8px; }

  .pax-cell {}
  .pax-display {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 5px 9px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    min-width: 100px;
    display: inline-block;
  }
  .pax-display:hover { border-color: var(--border-bright); }
  .pax-display.empty { color: var(--text-dimmer); }

  .more-input {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 5px 7px;
    border-radius: var(--radius);
    width: 100%;
    outline: none;
    transition: all 0.15s;
  }
  .more-input:hover { border-color: var(--border); }
  .more-input:focus { border-color: var(--border-bright); background: var(--surface2); }
  .more-input::placeholder { color: var(--border-bright); }

  .del-subrow-btn {
    background: transparent;
    border: none;
    color: var(--text-dimmer);
    cursor: pointer;
    font-size: 14px;
    padding: 4px 6px;
    border-radius: 4px;
    line-height: 1;
    transition: all 0.15s;
    opacity: 0;
  }
  .subrow:hover .del-subrow-btn { opacity: 1; }
  .del-subrow-btn:hover { color: var(--red); background: rgba(248,113,113,0.1); }

  /* ── AJETTU (DONE) CHECKBOX — rides panel only ── */
  .col-done { width: 70px; text-align: center !important; }
  .done-cell { text-align: center; }
  .done-toggle {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface2);
    border: 2px solid var(--border-bright);
    border-radius: var(--radius);
    color: transparent;
    font-size: 17px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .done-toggle:hover { border-color: var(--green); }
  .done-toggle.checked {
    background: var(--green);
    border-color: var(--green);
    color: #0a0e15;
  }
  .subrow.is-done .pax-display,
  .subrow.is-done .more-input {
    opacity: 0.4;
    text-decoration: line-through;
  }

  /* ── ADD TIMESLOT ROW ── */
  .add-timeslot-row td {
    padding: 12px 8px 4px 8px;
  }

  .add-timeslot-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-dimmer);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
  }
  .add-timeslot-btn:hover { border-color: var(--border-bright); color: var(--text); }

  /* ── SEPARATOR ── */
  .timeslot-separator {
    height: 1px;
    background: var(--border);
    margin: 0;
    opacity: 0.5;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dimmer);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 2;
  }

  /* ── POPUP OVERLAY ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .overlay.visible { opacity: 1; }

  .popup {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 10px;
    padding: 24px;
    min-width: 300px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transform: translateY(8px);
    transition: transform 0.15s;
  }
  .overlay.visible .popup { transform: translateY(0); }

  .popup-title {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .popup-field {
    margin-bottom: 14px;
  }

  .popup-label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dimmer);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .popup-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    padding: 8px 12px;
    border-radius: var(--radius);
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  .popup-input:focus { border-color: var(--border-bright); }

  /* Timeslot popup rows list */
  .slot-rows-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
    max-height: 200px;
    overflow-y: auto;
  }

  .slot-row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  .slot-row-del {
    background: transparent;
    border: none;
    color: var(--text-dimmer);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .slot-row-del:hover { color: var(--red); }

  .add-row-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
    margin-bottom: 16px;
  }
  .add-row-btn:hover { border-color: var(--border-bright); color: var(--text); }

  .popup-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .btn {
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .btn-primary {
    background: var(--accent-rides);
    color: #0a0e15;
    font-weight: 600;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary.mg { background: var(--accent-mg); }
  .btn-secondary {
    background: transparent;
    border-color: var(--border);
    color: var(--text-dim);
  }
  .btn-secondary:hover { border-color: var(--border-bright); color: var(--text); }
  .btn-danger {
    background: transparent;
    border-color: var(--red);
    color: var(--red);
    margin-right: auto;
  }
  .btn-danger:hover { background: rgba(248,113,113,0.1); }

  /* PAX popup */
  .pax-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .pax-total {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding: 8px;
    background: var(--surface2);
    border-radius: var(--radius);
    margin-bottom: 16px;
  }
  .pax-total span { color: var(--text); font-weight: 600; }

  .num-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: var(--radius);
    width: 100%;
    outline: none;
    text-align: center;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
  }
  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .num-input:focus { border-color: var(--border-bright); }

  /* Loading */
  .loading-state {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 40px;
    color: var(--text-dimmer);
    font-family: var(--mono);
    font-size: 12px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--text-dim);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">PÄIVÄRUNKO</div>
  <button class="lock-btn" id="lock-btn">LUKKO</button>
  <div class="date-picker-wrap">
    <div class="copy-wrap" id="copy-wrap">
      <button class="copy-btn" id="copy-start" data-copy-mode="off">Kopioi pohja</button>
      <span class="copy-target" id="copy-target" data-copy-mode="on"></span>
      <button class="copy-btn confirm" id="copy-confirm" data-copy-mode="on">Liitä</button>
      <button class="copy-btn" id="copy-cancel" data-copy-mode="on">Peruuta</button>
    </div>
    <button class="date-nav-btn" id="prev-day">&#8249;</button>
    <input type="date" id="date-input">
    <button class="date-nav-btn" id="next-day">&#8250;</button>
    <button class="today-btn" id="today-btn">TÄNÄÄN</button>
  </div>
  <div class="sync-indicator">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">yhdistetään</span>
  </div>
</div>

<div class="panels">

    <div class="lockscreen" id="lockscreen"></div>
  
    <div class="panel panel-rides" id="panel-rides">
    <div class="panel-header">
      <span class="panel-title">Ajot</span>
      <div class="panel-accent-bar"></div>
    </div>
    <div id="rides-content"><div class="loading-state"><div class="spinner"></div>lataa</div></div>
  </div>
  <div class="panel panel-mg" id="panel-mg">
    <div class="panel-header">
      <span class="panel-title">Meet &amp; Greet</span>
      <div class="panel-accent-bar"></div>
    </div>
    <div id="mg-content"><div class="loading-state"><div class="spinner"></div>lataa</div></div>
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="popup" id="popup"></div>
</div>

<script type="module">
// ── FIREBASE ──────────────────────────────────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc,
  getDocs, onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHAHeZvXIx1g2PAyNj5S5n-UU_ogdw_78",
  authDomain: "day-schedule-d18e1.firebaseapp.com",
  projectId: "day-schedule-d18e1",
  storageBucket: "day-schedule-d18e1.firebasestorage.app",
  messagingSenderId: "940587279805",
  appId: "1:940587279805:web:06d7d5b9f77783166fded4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── MEET & GREET TEMPLATE ─────────────────────────────────
// Edit this array to change the default M&G timeslots for new days.
// Only affects days that haven't been opened yet.
const MG_TEMPLATE_TIMES = [
  "10:00", "10:20", "10:40", "11:00", "11:20", "11:40", "13:00", "13:20", "13:40", "14:00", "14:20", "15:00", "15:20", "15:40",
];

// ── STATE ─────────────────────────────────────────────────
// IMPORTANT: each timeslot is now its own Firestore document, and each row
// inside a timeslot is its own Firestore document (in a sub-collection under
// that timeslot). Every edit writes to exactly the one document it changes.
// Nobody ever writes the "whole day" at once, so two people editing
// different rows (or different timeslots) can never overwrite each other's
// data, no matter how the timing lines up.
let currentDate = todayStr();
const state = {
  rides: { timeslots: {} }, // tsid -> { id, time, length, rows: { rowid -> {id, pax, more, order} } }
  mg:    { timeslots: {} }
};
const listeners = { rides: null, mg: null };
const debounceTimers = {}; // key -> { timer, fire }
const lastSig = { rides: null, mg: null };        // structure signature of what's currently on screen
const pendingRender = { rides: false, mg: false }; // a structural re-render waiting for the user to stop typing
let activePopup = null; // { panel, tsid, refresh() } — kept in sync with live data while a popup is open

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

// ── FIRESTORE PATH HELPERS ────────────────────────────────
function tsCollection(panel) {
  return collection(db, 'schedules', currentDate + '_' + panel, 'timeslots');
}
function tsDocRef(panel, tsid) {
  return doc(db, 'schedules', currentDate + '_' + panel, 'timeslots', tsid);
}
function rowsCollection(panel, tsid) {
  return collection(db, 'schedules', currentDate + '_' + panel, 'timeslots', tsid, 'rows');
}
function rowDocRef(panel, tsid, rowid) {
  return doc(db, 'schedules', currentDate + '_' + panel, 'timeslots', tsid, 'rows', rowid);
}

// ── SYNC INDICATOR ────────────────────────────────────────
const syncDot = document.getElementById('sync-dot');
const syncLabel = document.getElementById('sync-label');

function setSyncState(s) {
  syncDot.className = 'sync-dot' + (s === 'live' ? ' active' : s === 'saving' ? ' saving' : '');
  syncLabel.textContent = s === 'live' ? 'live' : s === 'saving' ? 'tallentaa' : 'päivittää';
}

// LOCKSCREEN
// When locked, ONLY the lock button works: the panels are covered by the
// lockscreen, and the header controls (date picker, copy/paste) are made inert.
document.getElementById('lock-btn').addEventListener('click', () => {
  const locked = document.getElementById('lockscreen').classList.toggle('active');
  document.getElementById('lock-btn').classList.toggle('active', locked);
  document.body.classList.toggle('locked', locked);
  const controls = document.querySelector('.date-picker-wrap');
  if (locked) {
    controls.setAttribute('inert', '');
    if (controls.contains(document.activeElement)) document.activeElement.blur();
  } else {
    controls.removeAttribute('inert');
  }
});

// ── DATE PICKER ───────────────────────────────────────────
const dateInput = document.getElementById('date-input');
dateInput.value = currentDate;

dateInput.addEventListener('change', () => { currentDate = dateInput.value; loadDay(); });

document.getElementById('today-btn').addEventListener('click', () => {
  currentDate = todayStr();
  dateInput.value = currentDate;
  loadDay();
});

document.getElementById('prev-day').addEventListener('click', () => {
  const d = new Date(currentDate + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  currentDate = d.toISOString().slice(0, 10);
  dateInput.value = currentDate;
  loadDay();
});

document.getElementById('next-day').addEventListener('click', () => {
  const d = new Date(currentDate + 'T12:00:00');
  d.setDate(d.getDate() + 1);
  currentDate = d.toISOString().slice(0, 10);
  dateInput.value = currentDate;
  loadDay();
});

// ── KOPIOI POHJA / LIITÄ ─────────────────────────────────
// Copy/paste: press "Kopioi pohja" on the day whose layout you want, browse
// to another day, press "Liitä". The rides layout (times, lengths, number of
// slots) is pasted onto that day with empty PAX, notes and Ajettu.
// Meet & Greet is never touched.
let clipboard = null; // { date, layout: [{ time, length, rowCount }] }
const copyWrap = document.getElementById('copy-wrap');
const copyStartBtn = document.getElementById('copy-start');
const pasteBtn = document.getElementById('copy-confirm');

const dayTs = date => collection(db, 'schedules', date + '_rides', 'timeslots');
const dayRows = (date, tsid) => collection(db, 'schedules', date + '_rides', 'timeslots', tsid, 'rows');

function fmtDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${parseInt(d)}.${parseInt(m)}.${y}`;
}

function updateCopyUI() {
  const on = !!clipboard;
  copyWrap.classList.toggle('active', on);
  document.body.classList.toggle('copy-mode', on);
  if (on) {
    document.getElementById('copy-target').textContent = 'pohja: ' + fmtDate(clipboard.date);
    pasteBtn.disabled = currentDate === clipboard.date;
    pasteBtn.title = pasteBtn.disabled ? 'Selaa päivään, johon haluat liittää rungon' : '';
  }
}

// COPY — snapshot the current day's rides layout.
copyStartBtn.addEventListener('click', async () => {
  const source = currentDate;
  copyStartBtn.disabled = true;
  try {
    const srcTs = await getDocs(dayTs(source));
    if (srcTs.empty) {
      alert('Tässä päivässä ei ole aikoja kopioitavaksi.');
      return;
    }
    const layout = [];
    for (const t of srcTs.docs) {
      const rows = await getDocs(dayRows(source, t.id));
      const d = t.data();
      layout.push({ time: d.time, length: d.length || '', rowCount: rows.size });
    }
    clipboard = { date: source, layout };
  } catch (err) {
    console.error('Copy failed:', err);
    alert('Kopiointi epäonnistui. Yritä uudelleen.');
  } finally {
    copyStartBtn.disabled = false;
    updateCopyUI();
  }
});

document.getElementById('copy-cancel').addEventListener('click', () => {
  clipboard = null;
  updateCopyUI();
});

// PASTE — replace the current day's rides with the copied layout.
pasteBtn.addEventListener('click', async () => {
  if (!clipboard || currentDate === clipboard.date) return;
  const target = currentDate;
  const { layout } = clipboard;

  pasteBtn.disabled = true;
  try {
    const tgtTs = await getDocs(dayTs(target));
    if (!tgtTs.empty && !confirm('Päivässä on jo dataa, haluatko varmasti korvata rungon?')) return;

    setSyncState('saving');
    // Delete the target day's existing rides, then create the copy.
    const ops = [];
    for (const t of tgtTs.docs) {
      const rows = await getDocs(dayRows(target, t.id));
      rows.forEach(r => ops.push(b => b.delete(r.ref)));
      ops.push(b => b.delete(t.ref));
    }
    const now = Date.now();
    layout.forEach(ts => {
      const tsRef = doc(dayTs(target));
      ops.push(b => b.set(tsRef, { time: ts.time, length: ts.length }));
      for (let i = 0; i < ts.rowCount; i++) {
        const rowRef = doc(dayRows(target, tsRef.id));
        ops.push(b => b.set(rowRef, { pax: [0,0,0,0], more: '', order: now + i }));
      }
    });

    // Firestore batches are capped at 500 writes.
    for (let i = 0; i < ops.length; i += 450) {
      const batch = writeBatch(db);
      ops.slice(i, i + 450).forEach(op => op(batch));
      await batch.commit();
    }

    clipboard = null; // done — back to normal mode
  } catch (err) {
    console.error('Paste failed:', err);
    alert('Liittäminen epäonnistui. Yritä uudelleen.');
  } finally {
    setSyncState('live');
    updateCopyUI();
  }
});

// ── LOAD DAY ──────────────────────────────────────────────
async function loadDay() {
  updateCopyUI();
  setSyncState('connecting');
  activePopup = null;
  closeOverlay();

  if (listeners.rides) { listeners.rides(); listeners.rides = null; }
  if (listeners.mg)    { listeners.mg();    listeners.mg = null; }

  state.rides.timeslots = {};
  state.mg.timeslots = {};
  lastSig.rides = lastSig.mg = null;
  pendingRender.rides = pendingRender.mg = false;

  document.getElementById('rides-content').innerHTML = '<div class="loading-state"><div class="spinner"></div>lataa</div>';
  document.getElementById('mg-content').innerHTML = '<div class="loading-state"><div class="spinner"></div>lataa</div>';

  await ensureDaySeeded('mg');
  // rides panel starts with zero timeslots — nothing to seed there.

  listeners.rides = attachPanelListeners('rides');
  listeners.mg    = attachPanelListeners('mg');
}

async function ensureDaySeeded(panel) {
  const snap = await getDocs(tsCollection(panel));
  if (!snap.empty) return;
  if (panel !== 'mg') return;

  const batch = writeBatch(db);
  MG_TEMPLATE_TIMES.forEach((t, i) => {
    const tsRef = doc(tsCollection(panel));
    batch.set(tsRef, { time: t, length: '' });
    const rowRef = doc(rowsCollection(panel, tsRef.id));
    batch.set(rowRef, { pax: [0,0,0,0], more: '', order: Date.now() + i });
  });
  await batch.commit();
}

// ── REAL-TIME LISTENERS ───────────────────────────────────
function attachPanelListeners(panel) {
  const rowUnsubs = {};

  const unsubTs = onSnapshot(tsCollection(panel), snap => {
    snap.docChanges().forEach(change => {
      const tsid = change.doc.id;

      if (change.type === 'removed') {
        delete state[panel].timeslots[tsid];
        if (rowUnsubs[tsid]) { rowUnsubs[tsid](); delete rowUnsubs[tsid]; }
        return;
      }

      const d = change.doc.data();
      if (!state[panel].timeslots[tsid]) {
        state[panel].timeslots[tsid] = { id: tsid, time: d.time, length: d.length || '', rows: {} };
      } else {
        state[panel].timeslots[tsid].time = d.time;
        state[panel].timeslots[tsid].length = d.length || '';
      }

      if (!rowUnsubs[tsid]) {
        rowUnsubs[tsid] = onSnapshot(rowsCollection(panel, tsid), rsnap => {
          const tsState = state[panel].timeslots[tsid];
          if (!tsState) return;
          rsnap.docChanges().forEach(rc => {
            const rowid = rc.doc.id;
            if (rc.type === 'removed') {
              delete tsState.rows[rowid];
            } else {
              const rd = rc.doc.data();
              tsState.rows[rowid] = { id: rowid, pax: rd.pax || [0,0,0,0], more: rd.more || '', order: rd.order || 0, done: !!rd.done };
            }
          });
          renderPanel(panel);
        });
      }
    });

    renderPanel(panel);
    setSyncState('live');
  }, err => console.error('Firestore listener error:', err));

  return () => {
    unsubTs();
    Object.values(rowUnsubs).forEach(u => u());
  };
}

// ── WRITE HELPERS ─────────────────────────────────────────
// Immediate single-field writes. Because every row/timeslot is its own
// document, none of these can ever touch data belonging to a different
// row or timeslot.
async function writeRowField(panel, tsid, rowid, field, value) {
  setSyncState('saving');
  try { await updateDoc(rowDocRef(panel, tsid, rowid), { [field]: value }); }
  finally { setSyncState('live'); }
}

async function writeTimeslotField(panel, tsid, field, value) {
  setSyncState('saving');
  try { await updateDoc(tsDocRef(panel, tsid), { [field]: value }); }
  finally { setSyncState('live'); }
}

// Debounced version for free-text typing, keyed per row+field so typing in
// one row's note never resets or blocks the save of another row's note.
// The document path is captured NOW, so a pending save can never land on a
// different day if someone switches the date mid-typing.
function debounceKey(panel, tsid, rowid, field) {
  return panel + '|' + tsid + '|' + rowid + '|' + field;
}

function debouncedRowField(panel, tsid, rowid, field, value, delay) {
  const key = debounceKey(panel, tsid, rowid, field);
  const ref = rowDocRef(panel, tsid, rowid);
  setSyncState('saving');
  if (debounceTimers[key]) clearTimeout(debounceTimers[key].timer);
  const fire = async () => {
    delete debounceTimers[key];
    try { await updateDoc(ref, { [field]: value }); }
    catch (err) { console.error('Save failed:', err); }
    finally { if (!Object.keys(debounceTimers).length) setSyncState('live'); }
  };
  debounceTimers[key] = { timer: setTimeout(fire, delay), fire };
}

// Save immediately (used when the user commits: Enter / closes keyboard / taps away).
function flushRowField(panel, tsid, rowid, field) {
  const p = debounceTimers[debounceKey(panel, tsid, rowid, field)];
  if (p) { clearTimeout(p.timer); p.fire(); }
}

// Flush everything if the tab is hidden / closed (phone locked, app switched).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    Object.values(debounceTimers).forEach(p => { clearTimeout(p.timer); p.fire(); });
  }
});

async function addRow(panel, tsid, rowData) {
  rowData = rowData || { pax: [0,0,0,0], more: '' };
  setSyncState('saving');
  try {
    const ref = doc(rowsCollection(panel, tsid));
    await setDoc(ref, { pax: rowData.pax, more: rowData.more, order: Date.now() });
    return ref.id;
  } finally { setSyncState('live'); }
}

async function deleteRow(panel, tsid, rowid) {
  setSyncState('saving');
  try { await deleteDoc(rowDocRef(panel, tsid, rowid)); }
  finally { setSyncState('live'); }
}

async function addTimeslot(panel, time, initialRows) {
  setSyncState('saving');
  try {
    const tsRef = doc(tsCollection(panel));
    const batch = writeBatch(db);
    batch.set(tsRef, { time, length: '' });
    initialRows.forEach((r, i) => {
      const rowRef = doc(rowsCollection(panel, tsRef.id));
      batch.set(rowRef, { pax: r.pax, more: r.more, order: Date.now() + i });
    });
    await batch.commit();
  } finally { setSyncState('live'); }
}

async function deleteTimeslot(panel, tsid) {
  setSyncState('saving');
  try {
    const rowsSnap = await getDocs(rowsCollection(panel, tsid));
    const batch = writeBatch(db);
    rowsSnap.forEach(d => batch.delete(d.ref));
    batch.delete(tsDocRef(panel, tsid));
    await batch.commit();
  } finally { setSyncState('live'); }
}

// ── RENDER PANEL ──────────────────────────────────────────
// Everything that affects the table's layout EXCEPT the free-text notes.
// If this hasn't changed, we only patch note values in place — no rebuild,
// so a focused input (and the mobile keyboard) is never destroyed.
function structureSig(panel) {
  return JSON.stringify(
    Object.values(state[panel].timeslots)
      .sort((a, b) => a.id.localeCompare(b.id))
      .map(ts => [ts.id, ts.time, ts.length,
        Object.values(ts.rows).sort((a, b) => a.id.localeCompare(b.id)).map(r => [r.id, r.pax, r.done, r.order])])
  );
}

function isTypingIn(container) {
  const el = document.activeElement;
  return !!(el && el.classList.contains('more-input') && container.contains(el));
}

// Update note fields with the latest synced text, skipping the one being typed in.
function patchNotes(panel, container) {
  container.querySelectorAll('.more-input[data-rowid]').forEach(el => {
    if (el === document.activeElement) return;
    const row = state[panel].timeslots[el.dataset.tsid]?.rows[el.dataset.rowid];
    if (row && el.value !== row.more) el.value = row.more;
  });
}

function renderPanel(panel) {
  const container = document.getElementById(panel + '-content');
  const sig = structureSig(panel);
  const hasTable = !!container.querySelector('table');

  // Only notes changed → live-patch the text, keep the DOM (and keyboard) intact.
  if (hasTable && sig === lastSig[panel]) {
    patchNotes(panel, container);
    if (activePopup && activePopup.panel === panel) activePopup.refresh();
    return;
  }

  // Layout changed while someone is typing here → wait until they're done.
  if (hasTable && isTypingIn(container)) {
    pendingRender[panel] = true;
    patchNotes(panel, container);
    if (activePopup && activePopup.panel === panel) activePopup.refresh();
    return;
  }

  pendingRender[panel] = false;
  lastSig[panel] = sig;
  const sorted = Object.values(state[panel].timeslots).sort((a, b) => a.time.localeCompare(b.time));
  const isRides = panel === 'rides';

  let html = `
    <table class="schedule-table">
      <thead>
        <tr>
          <th class="col-time">Aika</th>
          <th class="col-length">Pituus</th>
          <th class="col-pax">PAX</th>
          <th class="col-more">Lisätietoa</th>
          ${isRides ? '<th class="col-done">Ajettu</th>' : '<th style="width:30px"></th>'}
        </tr>
      </thead>
      <tbody>
  `;

  if (sorted.length === 0) {
    html += `<tr><td colspan="5"><div class="empty-state">Ei aikoja vielä.<br>Klikkaa + ajan lisäämiseksi.</div></td></tr>`;
  }

  sorted.forEach((ts, idx) => {
    const rows = Object.values(ts.rows).sort((a, b) => a.order - b.order);
    const lenVal = ts.length || '';
    const colorClass = lengthColorClass(lenVal);
    const badgeLabel = lenVal && lenVal !== '-' ? lenVal : '<span style="opacity:0.35">—</span>';

    html += `<tr class="timeslot-header-row ${colorClass}" data-tsid="${ts.id}">`;
    html += `<td class="time-cell" rowspan="${Math.max(rows.length, 1) + 1}">
      <div class="time-badge" data-action="edit-ts" data-panel="${panel}" data-tsid="${ts.id}">
        ${ts.time} <span class="edit-icon">✎</span>
      </div>
    </td>`;
    html += `<td class="length-cell" rowspan="${Math.max(rows.length, 1) + 1}">
      <div class="length-badge ${lenVal && lenVal !== '-' ? 'has-value' : ''}"
        data-action="edit-length" data-panel="${panel}" data-tsid="${ts.id}">
        ${badgeLabel}
      </div>
    </td>`;
    html += `<td colspan="3" style="padding:0;height:0;border:none;"></td>`;
    html += `</tr>`;

    if (rows.length === 0) {
      html += `<tr class="subrow ${colorClass}"><td class="pax-cell"><span class="pax-display empty">—</span></td><td><input class="more-input" placeholder="..." value="" disabled></td><td></td></tr>`;
    } else {
      rows.forEach(row => {
        const paxStr = paxDisplay(row.pax);
        const isEmpty = row.pax.every(v => v === 0);
        const doneCell = isRides
          ? `<td class="done-cell">
              <button class="done-toggle ${row.done ? 'checked' : ''}" title="Ajettu"
                data-action="toggle-done" data-panel="${panel}" data-tsid="${ts.id}" data-rowid="${row.id}">✓</button>
            </td>`
          : '';
        html += `<tr class="subrow ${colorClass} ${isRides && row.done ? 'is-done' : ''}" data-tsid="${ts.id}" data-rowid="${row.id}">
          <td class="pax-cell">
            <span class="pax-display ${isEmpty ? 'empty' : ''}"
              data-action="edit-pax" data-panel="${panel}" data-tsid="${ts.id}" data-rowid="${row.id}">
              ${isEmpty ? '·+·+·+·' : paxStr}
            </span>
          </td>
          <td>
            <input class="more-input" placeholder="..." enterkeyhint="done" autocomplete="off"
              value="${esc(row.more || '')}"
              data-action="edit-more" data-panel="${panel}" data-tsid="${ts.id}" data-rowid="${row.id}">
          </td>
         <!-- <td>
            <button class="del-subrow-btn" data-action="del-row"
              data-panel="${panel}" data-tsid="${ts.id}" data-rowid="${row.id}">✕</button>
          </td> -->
          ${doneCell}
        </tr>`;
      });
    }

    if (idx < sorted.length - 1) {
      html += `<tr><td colspan="5" style="padding:0"><div class="timeslot-separator"></div></td></tr>`;
    }
  });

  html += `<tr class="add-timeslot-row"><td colspan="5">
    <button class="add-timeslot-btn" data-action="add-ts" data-panel="${panel}">
      <span style="font-size:16px;line-height:1">+</span> Lisää aika
    </button>
  </td></tr>`;

  html += '</tbody></table>';
  container.innerHTML = html;

  container.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    if (action === 'edit-ts') {
      el.addEventListener('click', () => openEditTimeslotPopup(el.dataset.panel, el.dataset.tsid));
    } else if (action === 'add-ts') {
      el.addEventListener('click', () => openAddTimeslotPopup(el.dataset.panel));
    } else if (action === 'edit-pax') {
      el.addEventListener('click', () => openPaxPopup(el.dataset.panel, el.dataset.tsid, el.dataset.rowid));
    } else if (action === 'edit-length') {
      el.addEventListener('click', () => openLengthPopup(el.dataset.panel, el.dataset.tsid));
    } else if (action === 'edit-more') {
      const { panel: p, tsid, rowid } = el.dataset;
      // Near-live sync while typing.
      el.addEventListener('input', e => {
        const row = state[p].timeslots[tsid]?.rows[rowid];
        if (row) row.more = e.target.value;
        debouncedRowField(p, tsid, rowid, 'more', e.target.value, 400);
      });
      // Enter / "Done" on the keyboard commits and closes the keyboard.
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
      // Leaving the field (tap elsewhere, keyboard closed) saves immediately,
      // then applies any layout changes that arrived while typing.
      el.addEventListener('blur', () => {
        flushRowField(p, tsid, rowid, 'more');
        if (pendingRender[p]) {
          setTimeout(() => { if (!isTypingIn(container)) renderPanel(p); }, 350);
        }
      });
    } else if (action === 'toggle-done') {
      el.addEventListener('click', () => {
        const row = state[el.dataset.panel].timeslots[el.dataset.tsid]?.rows[el.dataset.rowid];
        if (!row) return;
        writeRowField(el.dataset.panel, el.dataset.tsid, el.dataset.rowid, 'done', !row.done);
      });
    } else if (action === 'del-row') {
      el.addEventListener('click', () => deleteRow(el.dataset.panel, el.dataset.tsid, el.dataset.rowid));
    }
  });

  if (activePopup && activePopup.panel === panel) activePopup.refresh();
}

// ── HELPERS ───────────────────────────────────────────────
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function paxDisplay(pax) {
  return (pax || [0,0,0,0]).join('+');
}

function lengthColorClass(val) {
  if (val === '500m') return 'ts-color-500m';
  if (val === '1km')  return 'ts-color-1km';
  if (val === '2km')  return 'ts-color-2km';
  if (val === '5km')  return 'ts-color-5km';
  return '';
}

// ── POPUP SYSTEM ──────────────────────────────────────────
const overlay = document.getElementById('overlay');
const popup   = document.getElementById('popup');

function openOverlay(html) {
  popup.innerHTML = html;
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('visible'));
}

function closeOverlay() {
  activePopup = null;
  overlay.classList.remove('visible');
  setTimeout(() => { overlay.style.display = 'none'; popup.innerHTML = ''; }, 150);
}

overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

// ── ADD TIMESLOT POPUP ────────────────────────────────────
// This timeslot doesn't exist in Firestore yet, so rows are staged locally
// until "Lisää aika" is clicked, then created together in one batch.
function openAddTimeslotPopup(panel) {
  const isMg = panel === 'mg';
  const accentClass = isMg ? 'mg' : '';

  openOverlay(`
    <div class="popup-title">Uusi aika — ${isMg ? 'Meet & Greet' : 'Ajot'}</div>
    <div class="popup-field">
      <label class="popup-label">Aloitusaika</label>
      <input class="popup-input" id="new-time" type="time" value="09:00">
    </div>
    <div class="popup-label" style="margin-bottom:8px">Slotit</div>
    <div class="slot-rows-list" id="new-rows-list"></div>
    <button class="add-row-btn" id="add-new-row">+ Lisää slotti</button>
    <div class="popup-actions">
      <button class="btn btn-secondary" id="popup-cancel">Peruuta</button>
      <button class="btn btn-primary ${accentClass}" id="popup-confirm">Lisää aika</button>
    </div>
  `);

  let tempRows = [];

  function renderRows() {
    const list = document.getElementById('new-rows-list');
    if (tempRows.length === 0) {
      list.innerHTML = '<div style="color:var(--text-dimmer);font-family:var(--mono);font-size:11px;padding:4px 0">Ei slotteja vielä</div>';
      return;
    }
    list.innerHTML = tempRows.map((r, i) => `
      <div class="slot-row-item">
        <span>Slotti ${i + 1}</span>
        <button class="slot-row-del" data-i="${i}">✕</button>
      </div>
    `).join('');
    list.querySelectorAll('.slot-row-del').forEach(btn => {
      btn.addEventListener('click', () => {
        tempRows.splice(parseInt(btn.dataset.i), 1);
        renderRows();
      });
    });
  }

  renderRows();

  document.getElementById('add-new-row').addEventListener('click', () => {
    tempRows.push({ pax: [0,0,0,0], more: '' });
    renderRows();
  });

  document.getElementById('popup-cancel').addEventListener('click', closeOverlay);

  document.getElementById('popup-confirm').addEventListener('click', async () => {
    const time = document.getElementById('new-time').value;
    if (!time) return;
    closeOverlay();
    await addTimeslot(panel, time, tempRows);
  });
}

// ── EDIT TIMESLOT POPUP ───────────────────────────────────
// This timeslot already exists, so add/delete row buttons write straight to
// Firestore immediately — everyone sees the change right away and there's
// nothing to "cancel" that could stomp someone else's edit.
function openEditTimeslotPopup(panel, tsid) {
  const ts = state[panel].timeslots[tsid];
  if (!ts) return;
  const isMg = panel === 'mg';
  const accentClass = isMg ? 'mg' : '';

  openOverlay(`
    <div class="popup-title">Muokkaa aikaa — ${ts.time}</div>
    <div class="popup-field">
      <label class="popup-label">Aloitusaika</label>
      <input class="popup-input" id="edit-time" type="time" value="${ts.time}">
    </div>
    <div class="popup-label" style="margin-bottom:8px">Slotit</div>
    <div class="slot-rows-list" id="edit-rows-list"></div>
    <button class="add-row-btn" id="add-edit-row">+ Lisää slotti</button>
    <div class="popup-actions">
      <button class="btn btn-danger" id="popup-delete">Poista aika</button>
      <button class="btn btn-secondary" id="popup-cancel">Peruuta</button>
      <button class="btn btn-primary ${accentClass}" id="popup-confirm">Tallenna</button>
    </div>
  `);

  function renderRowsList() {
    const currentTs = state[panel].timeslots[tsid];
    if (!currentTs) { closeOverlay(); return; }
    const list = document.getElementById('edit-rows-list');
    if (!list) return;
    const rows = Object.values(currentTs.rows).sort((a, b) => a.order - b.order);
    if (rows.length === 0) {
      list.innerHTML = '<div style="color:var(--text-dimmer);font-family:var(--mono);font-size:11px;padding:4px 0">Ei slotteja</div>';
      return;
    }
    list.innerHTML = rows.map((r, i) => `
      <div class="slot-row-item">
        <span>Slotti ${i + 1} <span style="color:var(--text-dimmer)">${paxDisplay(r.pax)}</span></span>
        <button class="slot-row-del" data-rowid="${r.id}">✕</button>
      </div>
    `).join('');
    list.querySelectorAll('.slot-row-del').forEach(btn => {
      btn.addEventListener('click', () => deleteRow(panel, tsid, btn.dataset.rowid));
    });
  }

  renderRowsList();
  activePopup = { panel, tsid, refresh: renderRowsList };

  document.getElementById('add-edit-row').addEventListener('click', () => { addRow(panel, tsid); });

  document.getElementById('popup-cancel').addEventListener('click', closeOverlay);

  document.getElementById('popup-delete').addEventListener('click', async () => {
    if (!confirm(`Poista ${ts.time} aika ja sen kaikki slotit?`)) return;
    closeOverlay();
    await deleteTimeslot(panel, tsid);
  });

  document.getElementById('popup-confirm').addEventListener('click', async () => {
    const newTime = document.getElementById('edit-time').value;
    closeOverlay();
    if (newTime && newTime !== ts.time) {
      await writeTimeslotField(panel, tsid, 'time', newTime);
    }
  });
}

// ── PAX POPUP ─────────────────────────────────────────────
function openPaxPopup(panel, tsid, rowid) {
  const ts = state[panel].timeslots[tsid];
  const row = ts && ts.rows[rowid];
  if (!row) return;
  const isMg = panel === 'mg';
  const accentClass = isMg ? 'mg' : '';
  const pax = [...(row.pax || [0,0,0,0])];

  openOverlay(`
    <div class="popup-title">PAX</div>
    <div class="pax-grid">
      <div class="popup-field">
        <label class="popup-label">Aikuiset</label>
        <input class="num-input" id="pax-0" type="number" min="0" value="${pax[0]}">
      </div>
      <div class="popup-field">
        <label class="popup-label">Lapset</label>
        <input class="num-input" id="pax-1" type="number" min="0" value="${pax[1]}">
      </div>
      <div class="popup-field">
        <label class="popup-label">Ilmaiset aikuiset</label>
        <input class="num-input" id="pax-2" type="number" min="0" value="${pax[2]}">
      </div>
      <div class="popup-field">
        <label class="popup-label">Ilmaiset lapset</label>
        <input class="num-input" id="pax-3" type="number" min="0" value="${pax[3]}">
      </div>
    </div>
    <div class="pax-total">Total: <span id="pax-total-val">${pax.reduce((a,b)=>a+b,0)}</span></div>
    <div class="popup-actions">
      <button class="btn btn-secondary" id="popup-cancel">Peruuta</button>
      <button class="btn btn-primary ${accentClass}" id="popup-confirm">Tallenna</button>
    </div>
  `);

  function updateTotal() {
    const total = [0,1,2,3].reduce((s,i) => s + (parseInt(document.getElementById('pax-'+i).value)||0), 0);
    document.getElementById('pax-total-val').textContent = total;
  }

  [0,1,2,3].forEach(i => {
    document.getElementById('pax-'+i).addEventListener('input', updateTotal);
  });

  document.getElementById('popup-cancel').addEventListener('click', closeOverlay);

  document.getElementById('popup-confirm').addEventListener('click', async () => {
    const newPax = [0,1,2,3].map(i => parseInt(document.getElementById('pax-'+i).value) || 0);
    closeOverlay();
    await writeRowField(panel, tsid, rowid, 'pax', newPax);
  });

  setTimeout(() => document.getElementById('pax-0').select(), 50);
}

// ── LENGTH PICKER POPUP ───────────────────────────────────
function openLengthPopup(panel, tsid) {
  const ts = state[panel].timeslots[tsid];
  if (!ts) return;
  const current = ts.length || '';
  const options = ['-', '500m', '1km', '2km', '5km'];

  openOverlay(`
    <div class="popup-title">Pituus — ${ts.time}</div>
    <div class="length-options">
      ${options.map(v => `
        <div class="length-option ${current === v || (v === '-' && !current) ? 'selected' : ''}" data-val="${v}">
          ${v === '-' ? '— ei pituutta' : v}
        </div>
      `).join('')}
    </div>
    <div class="popup-actions">
      <button class="btn btn-secondary" id="popup-cancel">Peruuta</button>
    </div>
  `);

  document.getElementById('popup-cancel').addEventListener('click', closeOverlay);

  popup.querySelectorAll('.length-option').forEach(opt => {
    opt.addEventListener('click', async () => {
      const val = opt.dataset.val;
      closeOverlay();
      await writeTimeslotField(panel, tsid, 'length', val === '-' ? '' : val);
    });
  });
}
