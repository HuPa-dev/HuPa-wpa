<!DOCTYPE html>
<html lang="en">
    <head>
                <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-PW8F46GKQH"></script>
        <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-PW8F46GKQH');

        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Husky Park — Activities</title>
        <link rel="stylesheet" href="../src/style.css?v=dev2" />
        <link rel="stylesheet" href="src/activities-style.css?v=dev4" />
        <link rel="stylesheet" href="https://use.typekit.net/itq8knf.css">
        <!-- Force light mode -->
        <meta name="color-scheme" content="light">
        <meta name="theme-color" content="#fff5e4">
        <meta name="supported-color-schemes" content="light"> 
        <style>
        :root { color-scheme: light; }
        </style>
       
    </head>
    <body style="min-height: 100%;">

        <div class="app-frame">

        <div id="page-loader">
        <div class="spinner"></div>
        </div>

        <div class="activity-popup" id="activityPopup" hidden>
            <div class="activity-popup-panel">
                <button class="activity-popup-close">×</button>
                <div class="activity-popup-scroll">
                    <div class="activity-popup-media"></div>
                    <div class="activity-popup-text">
                        <h2 class="activity-popup-title"></h2>
                        <div class="activity-popup-chips"></div>
                        <div class="activity-popup-body"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="app-scroll">
        <h1 class="page-title">ACTIVITIES</h1>
        <p class="page-subtitle">Tap a card for the full details.</p>
        <div class="activities-list">
        <div class="activity-card" id="husky-rides" style="--accent:#e2874c">
            <div class="activity-media" data-toggle>
                <span class="activity-tag">RIDES</span>
                <img src="../src/img/activity-photos/2km-goodlight-rides-4.jpg" alt="Guests riding a husky sled through snowy forest" loading="lazy" onerror="activityMediaFallback(this)" data-fallback-icon="📷">
            </div>
            <button class="activity-summary" data-toggle aria-haspopup="dialog">
                <div class="activity-summary-text">
                    <h2>Husky Rides</h2>
                    <p class="activity-teaser">A 2km husky-powered adventure through snowy forest trails.</p>
                    <div class="activity-chips">
            <span class="chip">🛷 2km route</span>
            <span class="chip">🎫 Ticket required</span>
            <span class="chip">👥 3–5 per sled</span>
                    </div>
                </div>
                <span class="activity-open-hint">Details ›</span>
            </button>
            <div class="activity-content" hidden data-article="articles/husky-rides.html"></div>
        </div>

        <div class="activity-card" id="meet-and-greet" style="--accent:#ea5a44">
            <div class="activity-media" data-toggle>
                <span class="activity-tag">MEET & GREET</span>
                <img src="../src/img/activity-photos/meetandgreet-snowyday-17.jpg" alt="Guests petting a husky in the snow" loading="lazy" onerror="activityMediaFallback(this)" data-fallback-icon="📷">
            </div>
            <button class="activity-summary" data-toggle aria-haspopup="dialog">
                <div class="activity-summary-text">
                    <h2>Husky Meet & Greet</h2>
                    <p class="activity-teaser">Treat-feeding, up-close time with our friendliest huskies.</p>
                    <div class="activity-chips">
            <span class="chip">⏱ ~30 min</span>
            <span class="chip">🎫 Ticket required</span>
            <span class="chip">🐾 Hands-on</span>
                    </div>
                </div>
                <span class="activity-open-hint">Details ›</span>
            </button>
            <div class="activity-content" hidden data-article="articles/meet-and-greet.html"></div>
        </div>

        <div class="activity-card" id="restaurant" style="--accent:#cf9a3e">
            <div class="activity-media" data-toggle>
                <span class="activity-tag">DINING</span>
                <img src="https://huskypark.fi/wp-content/uploads/2025/06/RaflaBufe-resize_5-1536x1025.jpg" alt="Interior of Musher's Tavern restaurant" loading="lazy" onerror="activityMediaFallback(this)" data-fallback-icon="🍲">
            </div>
            <button class="activity-summary" data-toggle aria-haspopup="dialog">
                <div class="activity-summary-text">
                    <h2>Musher's Tavern</h2>
                    <p class="activity-teaser">Warm meals, hot drinks, and souvenirs in a cozy setting.</p>
                    <div class="activity-chips">
            <span class="chip">🍲 Meals & drinks</span>
            <span class="chip">🆓 Free entry</span>
            <span class="chip">🎁 Souvenirs</span>
                    </div>
                </div>
                <span class="activity-open-hint">Details ›</span>
            </button>
            <div class="activity-content" hidden data-article="articles/restaurant.html"></div>
        </div>

        <div class="activity-card" id="mushers-rest" style="--accent:#4a8a6f">
            <div class="activity-media no-photo" data-toggle>
                <span class="activity-tag">REST STOP</span>
                <span class="placeholder-icon">🔥</span>
            </div>
            <button class="activity-summary" data-toggle aria-haspopup="dialog">
                <div class="activity-summary-text">
                    <h2>Musher's Rest</h2>
                    <p class="activity-teaser">An open-air cabin with a cozy fire — free for everyone to warm up.</p>
                    <div class="activity-chips">
            <span class="chip">🔥 Fireplace</span>
            <span class="chip">🆓 Free entry</span>
            <span class="chip">🪑 Seating available</span>
                    </div>
                </div>
                <span class="activity-open-hint">Details ›</span>
            </button>
            <div class="activity-content" hidden data-article="articles/mushers-rest.html"></div>
        </div>

        <div class="activity-card" id="private-cabin" style="--accent:#3f57a7">
            <div class="activity-media no-photo" data-toggle>
                <span class="activity-tag">PRIVATE</span>
                <span class="placeholder-icon">🛖</span>
            </div>
            <button class="activity-summary" data-toggle aria-haspopup="dialog">
                <div class="activity-summary-text">
                    <h2>Private Cabin</h2>
                    <p class="activity-teaser">A reserved, private space for your group — cozy, warm, just for you.</p>
                    <div class="activity-chips">
            <span class="chip">🔒 Reservation required</span>
            <span class="chip">👪 Private group space</span>
            <span class="chip">🔥 Warm & cozy</span>
                    </div>
                </div>
                <span class="activity-open-hint">Details ›</span>
            </button>
            <div class="activity-content" hidden data-article="articles/private-cabin.html"></div>
        </div>
        </div>
        </div>



            <div class="navlinks">
                <a href="../guide/" >
                    <img src="../src/img/guide.svg">
                    <h2>GUIDE</h2>
                </a>
                <a href="../map/">
                    <img src="../src/img/map.svg">
                    <h2>MAP</h2>
                </a>
                <a href="../activities/" class="active" onclick="return false;">
                    <img src="../src/img/activities.svg">
                    <h2>ACTIVITIES</h2>
                </a>
                <a href="../more/">
                    <img src="../src/img/more.svg">
                    <h2>MORE</h2>
                </a>
            </div>

        </div>

    <script src="../src/loader.js"></script>
    <script src="src/activities.js"></script>
    </body>

</html>
