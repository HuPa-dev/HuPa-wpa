<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice">
  <!-- Posterized arctic sky: 3 flat bands with rolling, swoopy edges + a few puffy clouds -->
  <rect width="400" height="150" fill="#9fc4e6"/>
  <!-- little sparkles / far clouds in the top band -->
  <g fill="#b3d1ec">
    <path d="M22 36c0-10 9-16 19-14 4-9 17-11 24-3 9-2 17 5 15 15H22z"/>
    <path d="M318 26c0-8 7-13 15-11 3-7 14-9 20-2 7-2 14 4 13 11h-48z"/>
  </g>
  <!-- middle band: big lazy swoops -->
  <path fill="#c2dbf0" d="M0 70C26 44 62 40 96 58s58 22 92 0 70-34 108-12 46 30 74 18 26-14 30-14V150H0z"/>
  <!-- puffy clouds sitting on the middle band -->
  <g fill="#d9e9f6">
    <path d="M176 78c-2-13 10-22 23-18 5-12 22-14 30-4 12-4 22 6 20 17 8 1 13 7 12 13h-94c-3-5 2-10 9-8z"/>
    <path d="M30 92c0-9 8-15 17-12 3-8 15-9 21-2 8-2 15 4 13 11H24c-1-3 2-5 6-3z"/>
  </g>
  <!-- bottom band, nearest the horizon -->
  <path fill="#e4eff7" d="M0 112c28-20 60-18 92-4s60 14 92-4 64-24 100-6 56 20 84 6 26-8 32-8V150H0z"/>
  <path fill="#f1f6f9" d="M318 120c0-8 7-13 15-11 3-7 13-8 18-2 7-1 13 4 11 11h-44z"/>
</svg>
